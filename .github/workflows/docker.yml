name: Publish container image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - backend/**
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - index.html
      - vite.config.js
      - .env.production
      - .github/workflows/docker.yml
      - scripts/verify-container.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/praesto-pro/rustdesk-api-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: praesto-rustdesk-api:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify combined API and frontend with disposable data
        env:
          CONTAINER_IMAGE: praesto-rustdesk-api:test
        run: |
          docker pull lejianwen/rustdesk-api:latest
          python3 -u scripts/verify-container.py
      - name: Publish the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag praesto-rustdesk-api:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
