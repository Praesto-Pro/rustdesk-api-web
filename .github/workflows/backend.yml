name: Account API verification
on:
  pull_request:
    paths:
      - backend/**
      - Dockerfile
      - .github/workflows/backend.yml
permissions:
  contents: read
jobs:
  account-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify pinned upstream extension and build the API
        run: bash backend/test.sh
